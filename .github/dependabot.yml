# ワークフローの action と Rust の crate を新しい版に上げる PR を作る（action は SHA で固定しているので、自動では
# 上がらない）。脆弱性のある依存を直す PR は、リポジトリの設定（Dependabot security updates）で別に作られる。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 出たばかりの版は待つ（乗っ取られた版がすぐ取り下げられることがあるので）。
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      crates:
        patterns: ['*']
