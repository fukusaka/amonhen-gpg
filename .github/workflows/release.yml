name: Release

# 正式版（v0.1.0 など）。タグのコミットで CI が通っていることを確かめ、build.yml で作って公証し、Release を作る。
on:
  push:
    tags: ['v[0-9]*']

permissions: {}

# 同じタグを打ち直したときに、2 つの Release を並べて作らない（途中のものは止めずに、終わってから次を流す）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read # タグのコミットを取ってくる
      actions: read # CI の結果を読む
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: タグと Cargo.toml の version が一致するか
        run: test "${GITHUB_REF_NAME#v}" = "$(scripts/version.sh stable)"
      - name: このコミットで CI が通っているか
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/require-ci.sh "$GITHUB_SHA"

  build:
    name: Build
    needs: check
    # actionlint がまだ $/ の書き方を読めないので、./ で呼ぶ。
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # コミットを取ってくる
    with:
      mode: stable
      notarize: true

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Release を作る
      # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
      id-token: write # 証明に署名する
      attestations: write # 証明を載せる
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: dist
      # リリースに載せるファイルに、このタグのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
