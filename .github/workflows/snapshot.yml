name: Snapshot

# main の CI が通ったコミットで、snapshot という pre-release を作り直す（テストが落ちたコミットは配らない）。
# 署名はするが公証はしない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
  id-token: write
  attestations: write

# 新しいコミットの CI が通ったら、前の snapshot の作成はやめる。
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/build.yml
    with:
      mode: snapshot
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app
          path: dist
      # リリースに載せるファイルに、このコミットのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot dist/*.zip --prerelease --target "$SHA" --title "Snapshot $VERSION" \
            --notes "The latest main ($VERSION), rebuilt whenever CI passes. Signed but not notarized."
