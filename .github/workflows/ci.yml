name: CI

# テストが通ったら、main への push では snapshot という pre-release を作り直す（テストが落ちたコミットは配らない）。
# snapshot は署名するが公証はしない。
on:
  push:
    branches: [main]
  # 文書だけを変える PR では流さない。main への push はいつも流す（release.yml がタグのコミットの CI を確かめるため）。
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# 既定では何も許さず、要るものだけをジョブで許す。
permissions: {}

# 同じブランチ・PR に新しく push したら、前の実行はやめる（main は最後まで流し、snapshot を載せるジョブだけを止める）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # コアは GTK4・WinUI でも使うので、Linux でも試す。結合テストは本物の gpg を一時的な鍵束で動かす（gpg がないと
  # 黙って飛ばすので、先に入っていることを確かめる）。
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.os == 'macOS'
        run: brew install gnupg
      - run: gpg --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  swift:
    name: Swift
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read # コミットを取ってくる
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install gnupg && gpg --version
      - run: scripts/build-core.sh
      - run: swift test
        working-directory: apps/macos

  snapshot-build:
    name: Snapshot build
    needs: [rust, swift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # actionlint がまだ $/ の書き方を読めないので、./ で呼ぶ。
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # コミットを取ってくる
    with:
      mode: snapshot
    # 署名と公証の鍵は環境 release の secret。渡さないと、環境を指定した build.yml のジョブの中でも空になる。
    secrets: inherit # zizmor: ignore[secrets-inherit]

  snapshot-publish:
    name: Snapshot publish
    needs: snapshot-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 新しいコミットの snapshot が来たら、前のものを載せるのはやめる。
    concurrency:
      group: snapshot-publish
      cancel-in-progress: true
    permissions:
      contents: write # Release を作る
      # ビルドの由来の証明（artifact attestations）。gh attestation verify で確かめられる。
      id-token: write # 証明に署名する
      attestations: write # 証明を載せる
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: dist
      # リリースに載せるファイルに、このコミットのこの CI で作ったことの証明を付ける。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.snapshot-build.outputs.version }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot dist/*.zip --prerelease --target "$GITHUB_SHA" --title "Snapshot $VERSION" \
            --notes "The latest main ($VERSION), rebuilt whenever CI passes. Signed but not notarized."
