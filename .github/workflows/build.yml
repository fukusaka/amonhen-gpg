name: Build

# 配る Amonhen GPG.app を作る（ci.yml の snapshot と release.yml から呼ぶ）。署名して zip にし、notarize なら公証に出して
# 結果を綴じ込む。成果物 app: dist/ の zip。
# 配るものなので、キャッシュは使わない（ほかの実行が書いたキャッシュを読むと、それに中身を左右されうる）。
# タグを打つ前の確認に、手でも起動できる（main で。署名と公証の secret は main と v* タグからしか使えない）。
# 正式版と同じく署名して公証し、zip を成果物に残すが、Release は作らない。
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [stable, snapshot]
        default: stable
      notarize:
        type: boolean
        default: true
  workflow_call:
    inputs:
      # 版（scripts/version.sh の stable か snapshot）。アプリの名前とバンドル ID も変わる。
      mode:
        type: string
        required: true
      # 作るコミット（空ならワークフローを起こしたコミット）。
      ref:
        type: string
        default: ''
      # 公証に出すか（正式版だけ）。
      notarize:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.package.outputs.version }}
      zip:
        value: ${{ jobs.package.outputs.zip }}

permissions: {}

# 同じワークフロー（呼ぶ側か手動）・同じ ref のビルドは 1 つずつ。途中で止めると公証が宙に浮くので、止めずに待たせる。
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, sign and notarize
    # 署名と公証の鍵は、環境 release の secret に置く（この仕事だけが読める）。呼ぶ側は secrets: inherit で渡す。
    environment: release
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read # コミットを取ってくる
    env:
      MODE: ${{ inputs.mode }}
      AMONHEN_CERT_P12: ${{ secrets.AMONHEN_CERT_P12 }}
      AMONHEN_CERT_PASSWORD: ${{ secrets.AMONHEN_CERT_PASSWORD }}
      AMONHEN_CERT_NAME: ${{ secrets.AMONHEN_CERT_NAME }}
      # 公証は正式版だけ（snapshot は自分用で、curl で入れれば quarantine の印が付かないので要らない）。
      AMONHEN_NOTARY_KEY: ${{ inputs.notarize && secrets.AMONHEN_NOTARY_KEY || '' }}
      AMONHEN_NOTARY_KEY_ID: ${{ inputs.notarize && secrets.AMONHEN_NOTARY_KEY_ID || '' }}
      AMONHEN_NOTARY_ISSUER: ${{ inputs.notarize && secrets.AMONHEN_NOTARY_ISSUER || '' }}
    outputs:
      version: ${{ steps.package.outputs.version }}
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # snapshot の版は、前のリリースからのコミット数を数える。
          fetch-depth: 0
          persist-credentials: false
      # runner の rustup で、その時点の stable を入れる。
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: scripts/import-signing-certificate.sh
      # Developer ID の署名がなければ止める（ad-hoc のものを配らない。secret が渡っていないのに気づけるように）。
      - run: test -n "${AMONHEN_SIGN_IDENTITY:-}"
      # 公証するときは、公証の鍵が 3 つともそろっていなければ止める（欠けていると、公証しないまま進んでしまう）。
      - if: inputs.notarize
        run: test -n "${AMONHEN_NOTARY_KEY:-}" && test -n "${AMONHEN_NOTARY_KEY_ID:-}" && test -n "${AMONHEN_NOTARY_ISSUER:-}"
      - id: package
        run: |
          echo "version=$(scripts/version.sh "$MODE")" >> "$GITHUB_OUTPUT"
          echo "zip=$(scripts/build-app.sh "$MODE" | tail -1)" >> "$GITHUB_OUTPUT"
      # 誰の署名か（ダウンロードしなくても、ここで確かめられるように）。
      - run: codesign -dvv dist/*.app 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp)='
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: dist/*.zip
          # Release に載せるまでの受け渡しだけなので、長く残さない。
          retention-days: 7
          if-no-files-found: error
