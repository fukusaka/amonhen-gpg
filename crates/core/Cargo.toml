[package]
name = "amonhen-gpg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# gpg-agent との鍵の受け渡しの包み（ssh_backup）。暗号の処理はこれだけ
aes-kw = { version = "0.3.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# git の allowed signers の記録（signers）
serde_json = "1"

# Unix: 子のシグナルマスク（process）と mktime。Windows: tm（mktime は C ランタイムの _mktime64 を自分で宣言する）
[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
